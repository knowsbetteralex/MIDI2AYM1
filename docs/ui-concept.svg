<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">MIDI2AYM1 — концепция обновлённого интерфейса</title>
  <desc id="desc">Тёмный интерфейс музыкального конвертера: источник и настройки чипа слева, три цветные карточки голосов AY в центре, отчёт и панель действий снизу. Значения и имя файла демонстрационные.</desc>
